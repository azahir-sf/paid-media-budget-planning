<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paid Media Budget Planning</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:#fff;color:#181818;font-size:13px;line-height:1.5}

/* ── Header ── */
header{background:#032D60;height:60px;display:flex;align-items:center;padding:0 32px;gap:16px;position:sticky;top:0;z-index:100}
.header-title{flex:1}
.header-title h1{font-size:15px;font-weight:600;color:#fff;letter-spacing:-0.2px}
.header-title p{font-size:11px;color:rgba(255,255,255,0.55);margin-top:1px}
.year-badge{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;letter-spacing:0.03em}

/* ── Filter bar ── */
.filter-bar{background:#F7F7F7;border-bottom:1px solid #E5E5E5;padding:10px 32px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:60px;z-index:99}
.filter-label{font-size:10px;font-weight:700;color:#9B9B9B;text-transform:uppercase;letter-spacing:0.08em;margin-right:4px}
.filter-btn{background:#fff;border:1px solid #E5E5E5;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:500;color:#181818;cursor:pointer;display:flex;align-items:center;gap:6px;transition:border-color .15s}
.filter-btn:hover{border-color:#0176D3;color:#0176D3}
.filter-btn .arrow{font-size:9px;color:#9B9B9B;transition:transform .15s}
.filter-btn.open .arrow{transform:rotate(180deg)}
.filter-sep{width:1px;height:18px;background:#E5E5E5;margin:0 4px}
.year-toggle{display:flex;border:1px solid #E5E5E5;border-radius:6px;overflow:hidden}
.year-toggle button{padding:5px 14px;font-size:12px;font-weight:500;border:none;cursor:pointer;background:#fff;color:#6B6B6B;transition:all .15s}
.year-toggle button.active{background:#032D60;color:#fff}
.reset-link{margin-left:auto;font-size:11px;color:#0176D3;cursor:pointer;text-decoration:none;font-weight:500}
.reset-link:hover{text-decoration:underline}

/* ── Dropdown panels ── */
.dropdown-wrap{position:relative}
.dropdown-panel{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid #E5E5E5;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.1);min-width:200px;max-height:320px;overflow-y:auto;z-index:200;display:none;padding:8px 0}
.dropdown-panel.open{display:block}
.dropdown-header{display:flex;justify-content:space-between;padding:6px 14px 8px;border-bottom:1px solid #F0F0F0;margin-bottom:4px}
.dropdown-header span{font-size:10px;font-weight:700;color:#9B9B9B;text-transform:uppercase;letter-spacing:0.08em}
.dropdown-header a{font-size:11px;color:#0176D3;cursor:pointer;text-decoration:none}
.dropdown-header a:hover{text-decoration:underline}
.dropdown-item{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;transition:background .1s}
.dropdown-item:hover{background:#F7F7F7}
.dropdown-item input[type=checkbox]{accent-color:#032D60;width:13px;height:13px;cursor:pointer}
.dropdown-item label{font-size:12px;color:#181818;cursor:pointer;flex:1}

/* ── Main content ── */
main{padding:28px 32px;max-width:1400px;margin:0 auto}

/* ── KPI cards ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.kpi-card{background:#fff;border:1px solid #E5E5E5;border-radius:8px;padding:24px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between}
.kpi-card-label{font-size:10px;font-weight:700;color:#9B9B9B;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px}
.kpi-card-value{font-size:32px;font-weight:700;color:#181818;letter-spacing:-0.5px;line-height:1}
.kpi-card-sub{font-size:12px;color:#6B6B6B;margin-top:6px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;margin-top:6px}
.delta.pos{color:#1A7F37;background:#DAFBE1}
.delta.neg{color:#CF222E;background:#FFEBE9}
.delta.neutral{color:#6B6B6B;background:#F0F0F0}

/* ── Section header ── */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.section-title{font-size:10px;font-weight:700;color:#9B9B9B;text-transform:uppercase;letter-spacing:0.1em}

/* ── Chart tabs ── */
.chart-tabs{display:flex;gap:4px;background:#F3F3F3;border-radius:8px;padding:3px;width:fit-content}
.chart-tab{padding:6px 16px;border-radius:6px;font-size:12px;font-weight:500;color:#6B6B6B;cursor:pointer;border:none;background:transparent;transition:all .15s}
.chart-tab.active{background:#032D60;color:#fff;font-weight:600}
.chart-tab:hover:not(.active){color:#181818;background:rgba(0,0,0,0.04)}

/* ── Chart container ── */
.chart-wrap{background:#fff;border:1px solid #E5E5E5;border-radius:8px;padding:24px;margin-bottom:24px}
.chart-inner{position:relative;height:320px}

/* ── Table ── */
.table-toggle{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:#0176D3;cursor:pointer;margin-bottom:12px;background:none;border:none;padding:0}
.table-toggle:hover{text-decoration:underline}
.table-wrap{display:none;overflow-x:auto;border:1px solid #E5E5E5;border-radius:8px;margin-bottom:32px}
.table-wrap.open{display:block}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:#F3F3F3}
thead th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;color:#6B6B6B;text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid #E5E5E5;white-space:nowrap}
tbody tr:nth-child(even){background:#FAFAFA}
tbody tr:hover{background:#EAF4FF}
tbody td{padding:9px 14px;color:#181818;border-bottom:1px solid #F0F0F0}
.chg-pos{color:#1A7F37;font-weight:600}
.chg-neg{color:#CF222E;font-weight:600}
.chg-flat{color:#9B9B9B}

/* ── Responsive ── */
@media(max-width:900px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .filter-bar{overflow-x:auto;flex-wrap:nowrap}
  main{padding:20px 16px}
  header{padding:0 16px}
}
@media(max-width:500px){
  .kpi-grid{grid-template-columns:1fr}
  .kpi-card-value{font-size:26px}
}
</style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>Paid Media Budget Planning</h1>
    <p>Media Finance &nbsp;·&nbsp; FY Budget Analysis</p>
  </div>
  <span class="year-badge" id="activeBadge">FY27 DATA</span>
</header>

<div class="filter-bar">
  <span class="filter-label">Filters</span>

  <div class="dropdown-wrap" id="ouWrap">
    <button class="filter-btn" id="ouBtn" onclick="toggleDropdown('ou')">
      <span id="ouLabel">OU: All</span><span class="arrow">▾</span>
    </button>
    <div class="dropdown-panel" id="ouPanel">
      <div class="dropdown-header">
        <span>Operating Unit</span>
        <a onclick="selectAll('ou')">All</a>&nbsp;/&nbsp;<a onclick="selectNone('ou')">None</a>
      </div>
      <div id="ouItems"></div>
    </div>
  </div>

  <div class="dropdown-wrap" id="cloudWrap">
    <button class="filter-btn" id="cloudBtn" onclick="toggleDropdown('cloud')">
      <span id="cloudLabel">Cloud: All</span><span class="arrow">▾</span>
    </button>
    <div class="dropdown-panel" id="cloudPanel">
      <div class="dropdown-header">
        <span>Cloud</span>
        <a onclick="selectAll('cloud')">All</a>&nbsp;/&nbsp;<a onclick="selectNone('cloud')">None</a>
      </div>
      <div id="cloudItems"></div>
    </div>
  </div>

  <div class="dropdown-wrap" id="bucketWrap">
    <button class="filter-btn" id="bucketBtn" onclick="toggleDropdown('bucket')">
      <span id="bucketLabel">Bucket: All</span><span class="arrow">▾</span>
    </button>
    <div class="dropdown-panel" id="bucketPanel">
      <div class="dropdown-header">
        <span>Bucket</span>
        <a onclick="selectAll('bucket')">All</a>&nbsp;/&nbsp;<a onclick="selectNone('bucket')">None</a>
      </div>
      <div id="bucketItems"></div>
    </div>
  </div>

  <div class="filter-sep"></div>

  <div class="year-toggle">
    <button id="fy27btn" class="active" onclick="setYear('fy27')">FY27</button>
    <button id="fy26btn" onclick="setYear('fy26')">FY26</button>
  </div>

  <a class="reset-link" onclick="resetAll()">Reset all</a>
</div>

<main>
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-card-label" id="kpi1label">FY27 Total Budget</div>
      <div>
        <div class="kpi-card-value" id="kpi1value">—</div>
        <div class="kpi-card-sub" id="kpi1sub"></div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-card-label">YoY Change</div>
      <div>
        <div class="kpi-card-value" id="kpi2value">—</div>
        <span class="delta neutral" id="kpi2delta">No prior data</span>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-card-label">Top OU by Spend</div>
      <div>
        <div class="kpi-card-value" id="kpi3value" style="font-size:22px;letter-spacing:-0.3px">—</div>
        <div class="kpi-card-sub" id="kpi3sub"></div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-card-label">Top Cloud by Spend</div>
      <div>
        <div class="kpi-card-value" id="kpi4value" style="font-size:22px;letter-spacing:-0.3px">—</div>
        <div class="kpi-card-sub" id="kpi4sub"></div>
      </div>
    </div>
  </div>

  <div class="section-header">
    <span class="section-title">Spend Breakdown</span>
    <div class="chart-tabs">
      <button class="chart-tab active" onclick="switchTab('ou',this)">By OU</button>
      <button class="chart-tab" onclick="switchTab('cloud',this)">By Cloud</button>
      <button class="chart-tab" onclick="switchTab('bucket',this)">By Bucket</button>
      <button class="chart-tab" onclick="switchTab('quarterly',this)">Quarterly</button>
    </div>
  </div>

  <div class="chart-wrap">
    <div class="chart-inner">
      <canvas id="mainChart"></canvas>
    </div>
  </div>

  <button class="table-toggle" onclick="toggleTable(this)">
    <span>▶</span> View data table
  </button>
  <div class="table-wrap" id="tableWrap">
    <table>
      <thead>
        <tr>
          <th>OU</th><th>Cloud</th><th>Bucket</th>
          <th id="th-primary">FY27</th><th id="th-compare">FY26</th><th>Change %</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</main>

<script>
let allData = [];
let activeYear = 'fy27';
let activeTab = 'ou';
let filters = { ou: new Set(), cloud: new Set(), bucket: new Set() };
let mainChart = null;

const FMT = v => {
  if (v >= 1e6) return '$' + (v/1e6).toFixed(1) + 'M';
  if (v >= 1e3) return '$' + Math.round(v/1e3) + 'K';
  return '$' + Math.round(v).toLocaleString();
};
const FMT_FULL = v => '$' + Math.round(v).toLocaleString();

function getCompareYear() { return activeYear === 'fy27' ? 'fy26' : 'fy27'; }

function getFiltered() {
  return allData.filter(d =>
    filters.ou.has(d.ou) &&
    filters.cloud.has(d.cloud) &&
    filters.bucket.has(d.bucket)
  );
}

function groupBy(data, key, year) {
  const map = {};
  data.forEach(d => {
    const k = d[key];
    if (!map[k]) map[k] = 0;
    map[k] += d[year] || 0;
  });
  return Object.entries(map).sort((a,b) => b[1]-a[1]);
}

// ── KPIs ──
function updateKPIs() {
  const data = getFiltered();
  const cy = activeYear, py = getCompareYear();
  const total = data.reduce((s,d) => s + (d[cy]||0), 0);
  const prior = data.reduce((s,d) => s + (d[py]||0), 0);
  const diff = total - prior;
  const pct = prior > 0 ? ((diff/prior)*100) : null;

  document.getElementById('kpi1label').textContent = cy.toUpperCase() + ' Total Budget';
  document.getElementById('kpi1value').textContent = FMT(total);
  document.getElementById('kpi1sub').textContent = '';

  document.getElementById('kpi2value').textContent = prior > 0 ? FMT(Math.abs(diff)) : '—';
  const d2 = document.getElementById('kpi2delta');
  if (pct !== null) {
    d2.textContent = (pct >= 0 ? '▲ ' : '▼ ') + Math.abs(pct).toFixed(1) + '% vs ' + py.toUpperCase();
    d2.className = 'delta ' + (pct >= 0 ? 'pos' : 'neg');
  } else {
    d2.textContent = 'No prior data';
    d2.className = 'delta neutral';
  }

  const ouTotals = groupBy(data, 'ou', cy);
  const cloudTotals = groupBy(data, 'cloud', cy);
  if (ouTotals.length) {
    document.getElementById('kpi3value').textContent = ouTotals[0][0];
    document.getElementById('kpi3sub').textContent = FMT(ouTotals[0][1]);
  }
  if (cloudTotals.length) {
    document.getElementById('kpi4value').textContent = cloudTotals[0][0];
    document.getElementById('kpi4sub').textContent = FMT(cloudTotals[0][1]);
  }
}

// ── Chart ──
function updateChart() {
  const data = getFiltered();
  const cy = activeYear, py = getCompareYear();
  let labels = [], cyVals = [], pyVals = [];

  if (activeTab === 'quarterly') {
    const quarters = ['Q1','Q2','Q3','Q4'];
    const qKeys = [cy+'q1', cy+'q2', cy+'q3', cy+'q4'];
    const pKeys = [py+'q1', py+'q2', py+'q3', py+'q4'];
    labels = quarters;
    cyVals = qKeys.map(k => data.reduce((s,d) => s+(d[k]||0), 0));
    pyVals = pKeys.map(k => data.reduce((s,d) => s+(d[k]||0), 0));
  } else {
    const key = activeTab === 'ou' ? 'ou' : activeTab === 'cloud' ? 'cloud' : 'bucket';
    const cyGroups = groupBy(data, key, cy);
    const pyMap = {};
    groupBy(data, key, py).forEach(([k,v]) => pyMap[k] = v);
    const top = cyGroups.slice(0, 20);
    labels = top.map(x => x[0]);
    cyVals = top.map(x => x[1]);
    pyVals = labels.map(l => pyMap[l] || 0);
  }

  const ctx = document.getElementById('mainChart').getContext('2d');
  if (mainChart) mainChart.destroy();

  const hasPrior = pyVals.some(v => v > 0);
  const datasets = [];
  if (hasPrior) {
    datasets.push({
      label: py.toUpperCase(),
      data: pyVals,
      backgroundColor: '#C9E0F5',
      borderRadius: 3,
      borderSkipped: false,
    });
  }
  datasets.push({
    label: cy.toUpperCase(),
    data: cyVals,
    backgroundColor: '#0176D3',
    borderRadius: 3,
    borderSkipped: false,
  });

  const maxVal = Math.max(...cyVals, ...pyVals, 1);

  mainChart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'top',
          align: 'end',
          labels: {
            boxWidth: 10,
            boxHeight: 10,
            borderRadius: 2,
            useBorderRadius: true,
            font: { family: 'Inter', size: 11 },
            color: '#6B6B6B',
            padding: 16,
          }
        },
        tooltip: {
          backgroundColor: '#fff',
          borderColor: '#E5E5E5',
          borderWidth: 1,
          titleColor: '#181818',
          bodyColor: '#6B6B6B',
          titleFont: { family: 'Inter', size: 12, weight: '600' },
          bodyFont: { family: 'Inter', size: 11 },
          padding: 10,
          callbacks: {
            label: ctx => ' ' + ctx.dataset.label + ': ' + FMT_FULL(ctx.raw)
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          border: { display: false },
          ticks: {
            font: { family: 'Inter', size: 10 },
            color: '#9B9B9B',
            maxRotation: 35,
          }
        },
        y: {
          max: maxVal * 1.12,
          border: { display: false },
          grid: { color: '#F0F0F0' },
          ticks: {
            font: { family: 'Inter', size: 10 },
            color: '#9B9B9B',
            callback: v => FMT(v),
            maxTicksLimit: 6,
          }
        }
      }
    }
  });
}

// ── Table ──
function updateTable() {
  const data = getFiltered();
  const cy = activeYear, py = getCompareYear();
  document.getElementById('th-primary').textContent = cy.toUpperCase();
  document.getElementById('th-compare').textContent = py.toUpperCase();

  const sorted = [...data].sort((a,b) => (b[cy]||0)-(a[cy]||0)).slice(0,200);
  const rows = sorted.map(d => {
    const cyv = d[cy]||0, pyv = d[py]||0;
    const pct = pyv > 0 ? ((cyv-pyv)/pyv*100) : null;
    const chgClass = pct === null ? 'chg-flat' : pct >= 0 ? 'chg-pos' : 'chg-neg';
    const chgText = pct === null ? '—' : (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';
    return `<tr>
      <td>${d.ou}</td><td>${d.cloud}</td><td>${d.bucket}</td>
      <td>${FMT_FULL(cyv)}</td><td>${FMT_FULL(pyv)}</td>
      <td class="${chgClass}">${chgText}</td>
    </tr>`;
  }).join('');
  document.getElementById('tableBody').innerHTML = rows;
}

function render() {
  updateKPIs();
  updateChart();
  updateTable();
}

// ── Filter setup ──
function buildFilter(type, values) {
  const container = document.getElementById(type + 'Items');
  container.innerHTML = '';
  values.forEach(v => {
    const item = document.createElement('div');
    item.className = 'dropdown-item';
    item.innerHTML = `<input type="checkbox" id="cb-${type}-${v}" checked>
      <label for="cb-${type}-${v}">${v}</label>`;
    item.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) filters[type].add(v);
      else filters[type].delete(v);
      updateFilterLabel(type);
      render();
    });
    container.appendChild(item);
    filters[type].add(v);
  });
  updateFilterLabel(type);
}

function updateFilterLabel(type) {
  const all = document.querySelectorAll(`#${type}Items input`).length;
  const sel = filters[type].size;
  const names = { ou: 'OU', cloud: 'Cloud', bucket: 'Bucket' };
  document.getElementById(type + 'Label').textContent =
    sel === all ? `${names[type]}: All` :
    sel === 0   ? `${names[type]}: None` :
                  `${names[type]}: ${sel}`;
}

function selectAll(type) {
  document.querySelectorAll(`#${type}Items input`).forEach(cb => {
    cb.checked = true;
    filters[type].add(cb.closest('.dropdown-item').querySelector('label').textContent);
  });
  updateFilterLabel(type);
  render();
}

function selectNone(type) {
  document.querySelectorAll(`#${type}Items input`).forEach(cb => { cb.checked = false; });
  filters[type].clear();
  updateFilterLabel(type);
  render();
}

function resetAll() {
  ['ou','cloud','bucket'].forEach(t => selectAll(t));
  setYear('fy27');
}

// ── Dropdowns ──
function toggleDropdown(type) {
  const panel = document.getElementById(type + 'Panel');
  const btn = document.getElementById(type + 'Btn');
  const isOpen = panel.classList.contains('open');
  closeAllDropdowns();
  if (!isOpen) {
    panel.classList.add('open');
    btn.classList.add('open');
  }
}
function closeAllDropdowns() {
  document.querySelectorAll('.dropdown-panel').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('open'));
}
document.addEventListener('click', e => {
  if (!e.target.closest('.dropdown-wrap')) closeAllDropdowns();
});

// ── Year toggle ──
function setYear(y) {
  activeYear = y;
  document.getElementById('fy27btn').classList.toggle('active', y === 'fy27');
  document.getElementById('fy26btn').classList.toggle('active', y === 'fy26');
  document.getElementById('activeBadge').textContent = y.toUpperCase() + ' DATA';
  render();
}

// ── Tab switch ──
function switchTab(tab, el) {
  activeTab = tab;
  document.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  updateChart();
}

// ── Table toggle ──
function toggleTable(btn) {
  const wrap = document.getElementById('tableWrap');
  const open = wrap.classList.toggle('open');
  btn.querySelector('span').textContent = open ? '▼' : '▶';
  btn.childNodes[1].textContent = open ? ' Hide data table' : ' View data table';
}

// ── Init ──
fetch('data.json')
  .then(r => r.json())
  .then(data => {
    allData = data;
    const ous     = [...new Set(data.map(d => d.ou))].filter(Boolean).sort();
    const clouds  = [...new Set(data.map(d => d.cloud))].filter(v => v && v !== 'All').sort();
    const buckets = [...new Set(data.map(d => d.bucket))].filter(Boolean).sort();
    buildFilter('ou', ous);
    buildFilter('cloud', clouds);
    buildFilter('bucket', buckets);
    render();
  })
  .catch(() => {
    document.querySelector('main').innerHTML =
      '<p style="color:#CF222E;padding:40px">Failed to load data.json. Make sure the file exists in the same directory.</p>';
  });
</script>
</body>
</html>
